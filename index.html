<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منظم المهام</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap hero"><div><span class="eyebrow">خطّط · أنجز · تقدّم</span><h1>منظّم المهام</h1><p>رتّب يومك، وركّز على ما يهم.</p></div><div class="hero-icon">✓</div></div></header><main class="wrap"><section class="stats"><article><span>كل المهام</span><strong id="allCount">0</strong></article><article><span>قيد التنفيذ</span><strong id="pendingCount">0</strong></article><article><span>مكتملة</span><strong id="doneCount">0</strong></article></section><section class="card add"><h2>أضف مهمة جديدة</h2><form id="taskForm"><input id="taskTitle" required maxlength="100" placeholder="ما المهمة التي تريد إنجازها؟"><select id="priority" aria-label="الأولوية"><option value="normal">عادية</option><option value="high">مهمة جدًا</option><option value="low">منخفضة</option></select><button class="primary">+ إضافة مهمة</button></form></section><section class="card"><div class="list-head"><div><h2>قائمة مهامي</h2><p>تابع تقدمك خطوة بخطوة</p></div><div class="filters"><button class="filter active" data-filter="all">الكل</button><button class="filter" data-filter="pending">غير المكتملة</button><button class="filter" data-filter="done">المكتملة</button></div></div><div id="tasks" class="tasks"></div><div id="empty" class="empty">✨ لا توجد مهام هنا. أضف مهمة وابدأ الإنجاز!</div></section></main><footer>مشروع تفاعلي بسيط لتنظيم الوقت والمهام</footer><script src="script.js"></script></body></html>
